name: Keyboard controller export consistency
on:
  push:
    paths: ['models/robotron-1715m/**', '.github/workflows/keyboard-controller.yml']
  pull_request:
    paths: ['models/robotron-1715m/**', '.github/workflows/keyboard-controller.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - run: python3 models/robotron-1715m/keyboard-controller/tools/test_export.py
      - run: python3 models/robotron-1715m/keyboard-controller/tools/test_reference_board.py
      - run: python3 models/robotron-1715m/keyboard-controller/tools/reference_assembly.py --check
      - run: python3 models/robotron-1715m/keyboard-controller/tools/reference_enclosure.py --check
      - run: python3 models/robotron-1715m/keyboard-controller/tools/connector_package_review.py --check
      - run: python3 models/robotron-1715m/keyboard-controller/tools/efs_registration_review.py --check
      - run: python3 models/robotron-1715m/keyboard-controller/tools/test_efs_registration_review.py
      - run: python3 models/robotron-1715m/keyboard-controller/tools/distributed_registration_review.py --check
      - run: python3 models/robotron-1715m/keyboard-controller/tools/test_distributed_registration_review.py
      - run: python3 models/robotron-1715m/keyboard-controller/tools/mount_hole_registration_review.py --check
      - run: python3 models/robotron-1715m/keyboard-controller/tools/registration_measurement_review.py --check
      - run: python3 models/robotron-1715m/keyboard-controller/tools/test_mount_hole_registration_review.py
      - run: python3 models/robotron-1715m/keyboard-controller/tools/test_row_spacing_review.py
      - run: python3 models/robotron-1715m/keyboard-controller/tools/row_spacing_review.py --check
      - run: python3 models/robotron-1715m/keyboard-controller/tools/test_shared_row_bias_review.py
      - run: python3 models/robotron-1715m/keyboard-controller/tools/shared_row_bias_review.py --check
      - run: python3 models/robotron-1715m/keyboard-controller/tools/test_outline_metric_review.py
      - run: python3 models/robotron-1715m/keyboard-controller/tools/outline_metric_review.py --check
      - run: python3 models/robotron-1715m/keyboard-controller/tools/capacitor_package_review.py --out models/robotron-1715m/keyboard-controller/reference/package-reviews/frolyt-eks --check
      - name: Check ceramic capacitor candidate receipts
        run: |
          for pair in nominal:0 minimum-pitch:-.78 maximum-pitch:.78; do
            python3 models/robotron-1715m/keyboard-controller/tools/capacitor_package_review.py --candidate models/robotron-1715m/keyboard-controller/reference/capacitor-package-ceramic.json --out "models/robotron-1715m/keyboard-controller/reference/package-reviews/kemet-c315/${pair%%:*}" --pitch-offset="${pair#*:}" --check
          done
      - name: Check low-profile capacitor candidate receipts
        run: |
          for pair in nominal:0 minimum-pitch:-.5 maximum-pitch:.5; do
            python3 models/robotron-1715m/keyboard-controller/tools/capacitor_package_review.py --candidate models/robotron-1715m/keyboard-controller/reference/capacitor-package-low-profile.json --out "models/robotron-1715m/keyboard-controller/reference/package-reviews/panasonic-ks/${pair%%:*}" --pitch-offset="${pair#*:}" --check
          done
      - run: python3 models/robotron-1715m/keyboard-controller/tools/test_lead_bends.py
      - run: python3 models/robotron-1715m/keyboard-controller/tools/test_reference_assembly.py
      - run: python3 models/robotron-1715m/keyboard-controller/tools/connection_review.py --check
      - run: python3 models/robotron-1715m/keyboard-controller/tools/cable_copper.py --check
      - run: python3 models/robotron-1715m/tools/test_controller_mesh_contract.py
      - run: python3 models/robotron-1715m/tools/check-metadata.py
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      KICAD_CLI: kicad-cli
      KICAD10_FOOTPRINT_DIR: /usr/share/kicad/footprints
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - name: Install KiCad 10 native tools
        # Official stable-series packages: https://www.kicad.org/download/ubuntu/
        run: |
          sudo add-apt-repository --yes --no-update ppa:kicad/kicad-10.0-releases
          sudo apt-get -o Acquire::Retries=3 -o APT::Update::Error-Mode=any update
          sudo apt-get -o Acquire::Retries=3 install --yes --no-install-recommends 'kicad=10.*' 'kicad-footprints=10.*' xvfb xauth
      - name: Record native tool versions
        run: |
          kicad-cli version
          /usr/bin/python3 -c 'import pcbnew; v=pcbnew.GetBuildVersion(); print(v); assert v.startswith("10."), "KiCad 10 is required"'
      - name: Check native regeneration and mismatch rejection
        run: xvfb-run -a /usr/bin/python3 models/robotron-1715m/keyboard-controller/tools/test_kicad.py
      - name: Check proposed reference routing and native pin identity
        run: xvfb-run -a /usr/bin/python3 models/robotron-1715m/keyboard-controller/tools/test_reference_kicad.py
      - name: Verify source checkout was not modified
        run: git diff --exit-code
